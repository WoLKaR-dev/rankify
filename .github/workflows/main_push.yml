name: Main Push

on: 
  # push:
    # branches:
      # - main
  workflow_dispatch:

jobs:
  merge_branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Merge branches
        run: |
          git config --global user.name "Auto Merger"
          git config --global user.email "action@github.com"
          git fetch
          git checkout daily
          git merge main
          git push