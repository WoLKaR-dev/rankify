name: Stable Push

on:
  push:
    branches:
    - stable
  workflow_dispatch:

jobs:
  build_web:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    #
    # Get code
    #
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GIT_TOKEN }}

    #
    # Install flutter
    #
    - name: Install flutter 
      uses: subosito/flutter-action@v2 
      with: 
        channel: stable 

    #
    # Build web app 
    #
    - name: Build web app 
      run: flutter build web --release --base-href /rankify/ 

    #
    # Push to web branch
    #
    - name: Push to web branch
      uses: JamesIves/github-pages-deploy-action@v4 
      with: 
        folder: build/web 
        branch: web 
        token: ${{ secrets.GITHUB_TOKEN }} 
        single-commit: true 
        commit-message: "Web Update"