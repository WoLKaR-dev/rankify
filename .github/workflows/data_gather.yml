name: Data gather
on: 
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Gets repo data
        uses: actions/checkout@v4
        
        with:
          ref: gather 
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install python
        uses: actions/setup-python@v5
        with: 
          python-version : '3.10'

      - name: Install dependencies 
        run: |
          pip install -r requirements.txt
        
      - name: Execute gather
        run: python3 data_gather.py
        env: 
          BS_API_KEY: ${{ secrets.BS_API_KEY }}
      
      - name: Commit & Push
        run: |
          git config global user.name = "Auto Gather"
          git config global user.email = "action@github.com"
          git add . 
          git commit -m "Data Gathered."
          git push 
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with: 
          name: training-data
          path: data.csv
